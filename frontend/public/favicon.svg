<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue tech gradient -->
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" /> <!-- Cyan -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Blue -->
    </linearGradient>
  </defs>
  
  <!-- Dark tech background (Rounded Square) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F172A" />
  
  <!-- Bot Head Base -->
  <rect x="14" y="22" width="36" height="26" rx="8" fill="none" stroke="url(#botGrad)" stroke-width="4" />
  
  <!-- Bot Ears / Side Nodes -->
  <line x1="8" y1="35" x2="14" y2="35" stroke="url(#botGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="35" x2="56" y2="35" stroke="url(#botGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Top Antenna -->
  <line x1="32" y1="22" x2="32" y2="12" stroke="url(#botGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="32" cy="10" r="4" fill="url(#botGrad)" />
  
  <!-- Eyes -->
  <circle cx="24" cy="31" r="3.5" fill="url(#botGrad)" />
  <circle cx="40" cy="31" r="3.5" fill="url(#botGrad)" />
  
  <!-- Friendly Bot Smile -->
  <path d="M 26 40 Q 32 44 38 40" fill="none" stroke="url(#botGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
